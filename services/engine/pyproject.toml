[project]
name = "scopeforge"
version = "0.1.9"
description = "ScopeForge — Commercial-Grade Cybersecurity Multi-Agent Harness & Claude Code/AGY Interactive CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Boopathi Raj", email = "boopathi@neuronestai.in" },
]
keywords = [
    "cybersecurity",
    "agent-harness",
    "claude-code",
    "agy",
    "cli",
    "tui",
    "textual",
    "langchain",
    "langgraph",
    "mcp",
    "security-automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Terminals",
]
dependencies = [
    "pydantic>=2.7",
    "anyio>=4.4",
    "httpx>=0.27",
    "prompt_toolkit>=3.0.38",
    "rich>=13.0.0",
    "textual>=8.0.0",
    "langchain>=1.0.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langgraph>=1.0.0",
    "llama-index-core>=0.14.0",
    "pyyaml>=6.0",
    "orjson>=3.9.0",
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.22", "hypothesis>=6"]

[project.scripts]
scopeforge = "scopeforge_engine.cli:main"
sourceforge = "scopeforge_engine.cli:main"
sf = "scopeforge_engine.cli:main"
agi = "scopeforge_engine.cli:main"
scopeforge-tui = "scopeforge_engine.tui.app:main"
scopeforge-engine = "scopeforge_engine.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scopeforge_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
