[project]
name = "scopeforge-engine"
version = "0.1.0"
description = "ScopeForge Python engine (stdio JSON-RPC)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "anyio>=4.4", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.22", "hypothesis>=6"]

[project.scripts]
scopeforge-engine = "scopeforge_engine.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scopeforge_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
