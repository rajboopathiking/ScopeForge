name: ci
on:
  push:
  pull_request:
jobs:
  spine:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - run: node scripts/generate-protocol.mjs --check
      - run: pnpm test
      # Full suite with provider runtime (httpx/anyio, conformance + replay).
      - run: uv sync --python 3.12 --all-extras --all-packages
      - run: uv run pytest services/engine/tests -q
      # Portability gate: stdlib-only spine stays green on bare interpreters.
      - run: python -m pytest services/engine/tests -q
